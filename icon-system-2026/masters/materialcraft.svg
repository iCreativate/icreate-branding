<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Material">
  <title>Material</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C222A"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="lift" cx="20%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="88" ry="88"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <rect width="512" height="512" fill="url(#lift)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="84" ry="84" fill="none" stroke="#303844" stroke-opacity="0.35" stroke-width="2"/>
  
    <circle cx="195" cy="225" r="45" fill="none" stroke="#F0ECE6" stroke-width="16"/>
    <circle cx="325" cy="225" r="45" fill="none" stroke="#F0ECE6" stroke-width="16"/>
    <circle cx="260" cy="345" r="45" fill="none" stroke="rgb(26,154,171)" stroke-width="16"/>
    <line x1="240" y1="225" x2="280" y2="225" stroke="#F0ECE6" stroke-width="10"/>
    <line x1="195" y1="270" x2="240" y2="330" stroke="rgb(26,154,171)" stroke-width="10"/>
    <line x1="325" y1="270" x2="280" y2="330" stroke="rgb(26,154,171)" stroke-width="10"/>
  <!-- family signature underline -->
  <rect x="300" y="410" width="100" height="14" rx="7" fill="rgb(26,154,171)"/>
</svg>
