<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Labs">
  <title>Labs</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C222A"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="lift" cx="20%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="88" ry="88"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <rect width="512" height="512" fill="url(#lift)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="84" ry="84" fill="none" stroke="#303844" stroke-opacity="0.35" stroke-width="2"/>
  
    <g stroke-linecap="round" stroke-width="18">
      <line x1="256" y1="250" x2="256" y2="130" stroke="rgb(91,124,255)"/>
      <line x1="256" y1="250" x2="256" y2="370" stroke="rgb(91,124,255)"/>
      <line x1="256" y1="250" x2="136" y2="250" stroke="#F0ECE6"/>
      <line x1="256" y1="250" x2="376" y2="250" stroke="#F0ECE6"/>
      <line x1="256" y1="250" x2="171" y2="165" stroke="#F0ECE6"/>
      <line x1="256" y1="250" x2="341" y2="335" stroke="#F0ECE6"/>
      <line x1="256" y1="250" x2="341" y2="165" stroke="rgb(91,124,255)"/>
      <line x1="256" y1="250" x2="171" y2="335" stroke="rgb(91,124,255)"/>
    </g>
    <circle cx="256" cy="250" r="28" fill="#F0ECE6"/>
  <!-- family signature underline -->
  <rect x="300" y="410" width="100" height="14" rx="7" fill="rgb(91,124,255)"/>
</svg>
