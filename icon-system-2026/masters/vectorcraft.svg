<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vector">
  <title>Vector</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C222A"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="lift" cx="20%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="88" ry="88"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <rect width="512" height="512" fill="url(#lift)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="84" ry="84" fill="none" stroke="#303844" stroke-opacity="0.35" stroke-width="2"/>
  
    <path d="M256 360 L200 200 L312 200 Z" fill="#F0ECE6"/>
    <line x1="200" y1="200" x2="160" y2="140" stroke="rgb(255,92,69)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="160" cy="140" r="12" fill="none" stroke="rgb(255,92,69)" stroke-width="8"/>
    <line x1="312" y1="200" x2="360" y2="150" stroke="rgb(255,92,69)" stroke-width="10"/>
    <circle cx="360" cy="150" r="12" fill="rgb(255,92,69)"/>
  <!-- family signature underline -->
  <rect x="300" y="410" width="100" height="14" rx="7" fill="rgb(255,92,69)"/>
</svg>
