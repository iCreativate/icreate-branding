<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CAD">
  <title>CAD</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C222A"/>
      <stop offset="100%" stop-color="#0B0E12"/>
    </linearGradient>
    <radialGradient id="lift" cx="20%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="88" ry="88"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <rect width="512" height="512" fill="url(#lift)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="84" ry="84" fill="none" stroke="#303844" stroke-opacity="0.35" stroke-width="2"/>
  
    <polyline points="160,160 160,360 360,360" fill="none" stroke="#F0ECE6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="260" r="30" fill="none" stroke="rgb(59,168,224)" stroke-width="14"/>
    <line x1="160" y1="260" x2="200" y2="260" stroke="rgb(59,168,224)" stroke-width="8"/>
    <line x1="260" y1="360" x2="260" y2="320" stroke="rgb(59,168,224)" stroke-width="8"/>
  <!-- family signature underline -->
  <rect x="300" y="410" width="100" height="14" rx="7" fill="rgb(59,168,224)"/>
</svg>
